    <mat-icon class="icon" aria-hidden="true">cloud_off</mat-icon>
    <h2 mat-dialog-title>Storage limit reached</h2>
    <mat-dialog-content>
      You've used {{ data.usedGb | number: '1.0-2' }} GB, the most your current plan includes.
      Upgrade to keep adding memories. Everything you've saved stays safe in the meantime.
    </mat-dialog-content>
    <mat-dialog-actions>
      <button mat-button mat-dialog-close>Not now</button>
      <button mat-flat-button [mat-dialog-close]="'upgrade'" cdkFocusInitial>See plans</button>
    </mat-dialog-actions>
