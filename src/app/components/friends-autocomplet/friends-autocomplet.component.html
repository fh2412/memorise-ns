<form>
  <mat-form-field appearance="outline">
    <mat-label>Add Friends to Memory</mat-label>
    <mat-chip-grid #chipGrid aria-label="friend selection">
      @for (friend of friends; track friend.user_id) {
      <mat-chip-row (removed)="remove(friend)">
        {{ friend.name }} ({{ friend.email }})
        <button matChipRemove [attr.aria-label]="'remove ' + friend.name">
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip-row>
      }
    </mat-chip-grid>

    <input placeholder="Type friend's name or email..." #friendInput [formControl]="friendCtrl"
      [matChipInputFor]="chipGrid" [matAutocomplete]="auto" (matChipInputTokenEnd)="add($event)" />

    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
      @for (friend of filteredfriends | async; track friend.user_id) {
      <mat-option [value]="friend">
        {{ friend.name }} ({{ friend.email }})
      </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</form>
