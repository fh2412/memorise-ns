<div class="friends-profile-container">
  <div class="profile-pics-wrapper" [style.width.px]="wrapperWidth">
    <!-- Display the first avatars -->
    @for (friend of displayedFriends; track friend.user_id; let i = $index) {
      <div
        class="profile-pic mat-elevation-z2"
        [style.z-index]="displayedFriends.length - i + 1"
        [style.left.px]="i * overlap"
        [matTooltip]="getTooltipText(friend)"
        matTooltipPosition="above"
      >
        @if (friend.profilepic) {
          <img
            [src]="friend.profilepic"
            [alt]="friend.name + ' profile picture'"
            class="profile-image"
            (error)="onImageError($event)"
          />
        } @else {
          <div class="default-avatar">
            <mat-icon class="avatar-icon">person</mat-icon>
            <span class="initials">{{ getInitials(friend.name) }}</span>
          </div>
        }
      </div>
    }

    <!-- Circle with the number of the remaining friends -->
    @if (remainingCount > 0) {
      <div
        class="profile-pic remaining-chip mat-elevation-z2"
        [style.z-index]="0"
        [style.left.px]="displayedFriends.length * overlap"
        [matTooltip]="getRemainingTooltip()"
        matTooltipPosition="above"
        role="img"
        [attr.aria-label]="remainingCount + ' more friends'"
      >
        <span class="remaining-count">{{ remainingLabel }}</span>
      </div>
    }
  </div>
</div>
