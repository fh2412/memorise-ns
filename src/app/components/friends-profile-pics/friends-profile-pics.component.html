<div class="friends-profile-container">
  <div class="profile-pics-wrapper" [style.width.px]="wrapperWidth">
    @for (friend of displayedFriends; track friend.user_id; let i = $index) {
      <app-profile-avatar
        class="stack-item"
        [style.z-index]="displayedFriends.length - i + 1"
        [style.left.px]="i * overlap"
        [src]="friend.profilepic"
        [name]="friend.name"
        [size]="avatarSize"
        [matTooltip]="getTooltipText(friend)"
        matTooltipPosition="above"
      />
    }

    @if (remainingCount > 0) {
      <div
        class="remaining-chip stack-item"
        [style.z-index]="1"
        [style.left.px]="displayedFriends.length * overlap"
        [style.width.px]="avatarSize"
        [style.height.px]="avatarSize"
        [matTooltip]="getRemainingTooltip()"
        matTooltipPosition="above"
        role="img"
        [attr.aria-label]="remainingCount + ' more friends'"
      >
        <span class="remaining-count">{{ remainingLabel }}</span>
      </div>
    }
  </div>
</div>
