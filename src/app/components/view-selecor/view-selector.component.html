<div class="view-switcher-wrapper">
  <mat-icon [class.active-icon]="selectedValue() === 'standard'">border_all</mat-icon>
  
  <mat-slide-toggle 
    [checked]="selectedValue() === 'map'"
    (change)="toggleView($event.checked)" 
    aria-label="Toggle view between list and map">
  </mat-slide-toggle>
  
  <mat-icon [class.active-icon]="selectedValue() === 'map'">map</mat-icon>
</div>
