<div class="crew-planner">
  <header class="section-header">
    <h2>Gather Your Crew</h2>
    <p>Lock in who is coming along before tracking the layout and details.</p>
  </header>

  <section class="title-workspace">
    <mat-form-field appearance="outline" class="title-field">
      <mat-label>Name this memory</mat-label>
      <mat-icon matPrefix>edit_note</mat-icon>
      <input matInput type="text" [ngModel]="memoryTitle()" (ngModelChange)="memoryTitle.set($event)"
        placeholder="e.g. Vienna to Italy Rickshaw Trip" autocomplete="off" />
      @if (memoryTitle()) {
      <button matSuffix mat-icon-button aria-label="Clear" (click)="memoryTitle.set('')">
        <mat-icon>close</mat-icon>
      </button>
      }
    </mat-form-field>
  </section>

  <!-- Notice the two-way binding with [(crew)] -->
  <app-crew-selector [(crew)]="selectedCrew"> </app-crew-selector>
  
  <button mat-flat-button class="start-btn" 
          (click)="startPlanningMemory()">
    <mat-icon>arrow_forward</mat-icon>
    Start Planning with your Crew!
  </button>
</div>
